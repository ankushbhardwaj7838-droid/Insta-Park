<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insta-Park — Park Smart. Park Instantly.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B3D;
    --navy-2:#182A57;
    --blue:#2F6FED;
    --blue-dim:#e8eefd;
    --amber:#FFB100;
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --text:#16192A;
    --muted:#6B7280;
    --green:#1C9A5B;
    --green-dim:#e7f7ef;
    --red:#E5484D;
    --red-dim:#fdeceb;
    --border:#E7E9EE;
    --radius:14px;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,.disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  ::selection{background:var(--amber);color:var(--navy);}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  .hide{display:none !important;}
  .scrollx{overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
  .scrollx::-webkit-scrollbar{display:none;}

  /* ---------- App frame ---------- */
  #app{min-height:100%;padding-bottom:78px;}
  header.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;height:64px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),#5b8cff);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .navlinks{display:flex;align-items:center;gap:26px;font-size:14.5px;font-weight:500;color:#c7cee6;}
  .navlinks a:hover{color:#fff;}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14.5px;transition:transform .12s ease,filter .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-amber:hover{filter:brightness(1.05);}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-blue:hover{filter:brightness(1.08);}
  .btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-block{width:100%;display:block;text-align:center;}
  .btn-lg{padding:15px 20px;font-size:15.5px;border-radius:12px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;}
  .pill-green{background:var(--green-dim);color:var(--green);}
  .pill-amber{background:#FFF4DB;color:#8a5a00;}
  .pill-red{background:var(--red-dim);color:var(--red);}
  .pill-blue{background:var(--blue-dim);color:var(--blue);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .muted{color:var(--muted);}
  .icon{width:17px;height:17px;flex:none;}

  /* bottom mobile nav */
  nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);}
  nav.bottomnav button{flex:1;background:none;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;}
  nav.bottomnav button.active{color:var(--blue);}
  @media(min-width:860px){nav.bottomnav{display:none;} #app{padding-bottom:0;}}
  @media(max-width:859px){.navlinks{display:none;}}

  /* ---------- HOME ---------- */
  .hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:52px 0 90px;}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(47,111,237,.35),transparent 70%);}
  .hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 14px;max-width:620px;}
  .hero p{color:#b9c1de;font-size:16.5px;max-width:480px;margin:0 0 30px;}
  .searchbox{background:#fff;border-radius:16px;padding:8px;display:flex;gap:8px;max-width:560px;position:relative;z-index:2;box-shadow:0 20px 40px -14px rgba(0,0,0,.5);}
  .searchbox input{flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;border-radius:10px;color:var(--text);font-family:inherit;}
  .chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:2;}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#dbe1f5;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;}
  .chip:hover{background:rgba(255,255,255,.16);}

  .section{padding:52px 0;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
  .section-head h2{font-size:24px;margin:0;}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative;margin-top:-52px;z-index:3;}
  @media(max-width:760px){.steps{grid-template-columns:1fr;margin-top:-30px;}}
  .step{background:#fff;border-radius:16px;padding:22px;box-shadow:0 12px 30px -18px rgba(16,27,61,.35);}
  .step .num{width:34px;height:34px;border-radius:10px;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';margin-bottom:12px;}
  .step h3{margin:0 0 6px;font-size:16.5px;}
  .step p{margin:0;color:var(--muted);font-size:14px;}

  .grid-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:900px){.grid-cards{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.grid-cards{grid-template-columns:1fr 1fr;}}
  .area-card{padding:16px;cursor:pointer;transition:border-color .15s;}
  .area-card:hover{border-color:var(--blue);}
  .area-card .thumb{height:66px;border-radius:10px;background:linear-gradient(135deg,#eef2ff,#dfe8ff);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:22px;}
  .area-card h4{margin:0 0 3px;font-size:14.5px;}
  .area-card span{font-size:12.5px;color:var(--muted);}

  .promo-banner{background:linear-gradient(120deg,var(--navy),var(--navy-2));border-radius:20px;padding:36px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;flex-wrap:wrap;}
  .promo-banner h3{margin:0 0 8px;font-size:22px;}
  .promo-banner p{margin:0;color:#b9c1de;max-width:420px;font-size:14.5px;}

  /* ---------- SEARCH / RESULTS ---------- */
  .search-header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:30;padding:12px 0;}
  .search-header .row{display:flex;gap:10px;align-items:center;}
  .search-header input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14.5px;outline:none;font-family:inherit;}
  .search-header input:focus{border-color:var(--blue);}
  .filter-bar{display:flex;gap:8px;margin-top:10px;}
  .filter-chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;flex:none;}
  .filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .viewtoggle{display:none;gap:6px;background:var(--bg);border-radius:10px;padding:4px;}
  .viewtoggle button{border:none;background:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);}
  .viewtoggle button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  @media(max-width:859px){.viewtoggle{display:flex;}}

  .search-body{display:grid;grid-template-columns:420px 1fr;gap:0;height:calc(100vh - 128px);min-height:520px;}
  @media(max-width:859px){.search-body{display:block;height:auto;}}
  .list-col{overflow-y:auto;padding:16px 20px;border-right:1px solid var(--border);}
  .map-col{position:relative;background:
      linear-gradient(0deg,rgba(47,111,237,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(47,111,237,.05) 1px,transparent 1px);
    background-size:34px 34px;background-color:#EAF0FE;overflow:hidden;
  }
  @media(max-width:859px){.map-col{height:340px;} .list-col{border-right:none;padding:14px 20px;}}
  .map-note{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;}
  .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;text-align:center;}
  .pin .tag{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);}
  .pin::after{content:"";display:block;width:0;height:0;margin:0 auto;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--navy);}
  .pin.sel .tag{background:var(--amber);color:var(--navy);}
  .pin.sel::after{border-top-color:var(--amber);}
  .pin.full .tag{background:#8a8f9c;}
  .pin.full::after{border-top-color:#8a8f9c;}

  .pcard{padding:14px;margin-bottom:12px;cursor:pointer;display:flex;gap:12px;transition:border-color .15s,transform .1s;}
  .pcard:hover{border-color:var(--blue);}
  .pcard.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim);}
  .pcard .thumb{width:74px;height:74px;border-radius:10px;flex:none;background:linear-gradient(135deg,#dfe8ff,#c9d8ff);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .pcard .body{flex:1;min-width:0;}
  .pcard .top{display:flex;justify-content:space-between;gap:8px;}
  .pcard h4{margin:0;font-size:15px;}
  .pcard .price{font-weight:700;font-family:'Space Grotesk';white-space:nowrap;}
  .pcard .meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:center;}
  .amenity-row{display:flex;gap:6px;margin-top:8px;}
  .amenity-row .ic{width:24px;height:24px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty-state .em{font-size:38px;margin-bottom:10px;}

  /* ---------- DETAILS ---------- */
  .detail-header{position:sticky;top:64px;background:#fff;border-bottom:1px solid var(--border);z-index:20;padding:12px 0;display:flex;align-items:center;gap:12px;}
  .backbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:280px;border-radius:16px;overflow:hidden;margin:18px 0;}
  .gallery > div{grid-row:span 2;}
  .gallery > div:nth-child(2),.gallery>div:nth-child(3){grid-row:span 1;}
  .gph{background:linear-gradient(135deg,#dfe8ff,#c9d8ff);display:flex;align-items:center;justify-content:center;font-size:30px;color:#8ba3e8;}
  @media(max-width:700px){.gallery{grid-template-columns:1fr 1fr;height:200px;}}
  .detail-grid{display:grid;grid-template-columns:1fr 340px;gap:30px;align-items:start;padding-bottom:110px;}
  @media(max-width:900px){.detail-grid{grid-template-columns:1fr;}}
  .inv-bar{display:flex;height:12px;border-radius:8px;overflow:hidden;margin:10px 0 8px;}
  .inv-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
  .inv-legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;}
  .amgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  @media(max-width:520px){.amgrid{grid-template-columns:repeat(2,1fr);}}
  .amitem{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;}
  .accord{border-top:1px solid var(--border);}
  .accord summary{padding:14px 2px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .accord summary::-webkit-details-marker{display:none;}
  .accord p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6;}
  .review{padding:14px 0;border-top:1px solid var(--border);}
  .review .rh{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;}
  .stars{color:var(--amber);font-size:13px;}
  .sticky-cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .sticky-cta .p{font-family:'Space Grotesk';font-weight:700;font-size:19px;}
  .sticky-cta .p span{font-size:12.5px;font-weight:500;color:var(--muted);display:block;font-family:'Inter';}

  /* ---------- BOOKING ---------- */
  .bk-shell{max-width:640px;margin:0 auto;padding-bottom:130px;}
  .stepper{display:flex;align-items:center;margin:22px 0 8px;}
  .stepper .sdot{width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;}
  .stepper .sdot.on{background:var(--blue);color:#fff;}
  .stepper .sdot.done{background:var(--green);color:#fff;}
  .stepper .sline{flex:1;height:2px;background:var(--border);margin:0 6px;}
  .stepper .sline.on{background:var(--blue);}
  .bk-card{padding:22px;margin-bottom:16px;}
  .bk-card h3{margin:0 0 16px;font-size:17px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .field input,.field select{border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;font-size:14.5px;font-family:inherit;outline:none;}
  .field input:focus,.field select:focus{border-color:var(--blue);}
  .duration-ctl{display:flex;align-items:center;gap:14px;justify-content:center;border:1.5px solid var(--border);border-radius:12px;padding:14px;}
  .duration-ctl button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;font-weight:700;}
  .duration-ctl .val{font-family:'Space Grotesk';font-size:20px;font-weight:700;min-width:110px;text-align:center;}
  .vcard{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;}
  .vcard.sel{border-color:var(--blue);background:var(--blue-dim);}
  .vcard .vic{width:38px;height:38px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .radio-dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--border);flex:none;position:relative;}
  .vcard.sel .radio-dot{border-color:var(--blue);}
  .vcard.sel .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--blue);}
  .price-row{display:flex;justify-content:space-between;font-size:14.5px;padding:7px 0;}
  .price-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:12px;font-weight:700;font-size:16.5px;font-family:'Space Grotesk';}
  .pay-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:9px;font-weight:600;font-size:14px;}
  .pay-opt.sel{border-color:var(--blue);background:var(--blue-dim);}

  /* ---------- CONFIRMATION / ACTIVE ---------- */
  .confirm-shell{max-width:460px;margin:0 auto;padding:30px 20px 60px;text-align:center;}
  .checkmark{width:64px;height:64px;border-radius:50%;background:var(--green-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;color:var(--green);animation:pop .5s cubic-bezier(.26,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){.checkmark{animation:none;}}
  #qrcanvas{margin:18px auto;border-radius:14px;border:8px solid #fff;box-shadow:0 8px 26px -10px rgba(16,27,61,.3);}
  .otp-box{display:inline-flex;gap:8px;margin:6px 0 18px;}
  .otp-box span{width:34px;height:40px;border:1.5px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:17px;}
  .conf-detail{text-align:left;padding:16px;margin:18px 0;}
  .conf-detail .r{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-top:1px solid var(--border);}
  .conf-detail .r:first-child{border-top:none;}
  .conf-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .conf-actions .full{grid-column:span 2;}

  .active-badge{position:fixed;bottom:78px;left:16px;right:16px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:38;box-shadow:0 14px 30px -14px rgba(0,0,0,.4);}
  @media(min-width:860px){.active-badge{bottom:16px;max-width:420px;left:20px;right:auto;}}
  .active-badge .dotlive{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:blink 1.4s infinite;flex:none;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  @media (prefers-reduced-motion: reduce){.active-badge .dotlive{animation:none;}}
  .timer-big{font-family:'Space Grotesk';font-size:52px;font-weight:700;letter-spacing:.02em;}
  .active-shell{max-width:460px;margin:0 auto;padding:36px 20px 100px;text-align:center;}

  /* ---------- generic role screens ---------- */
  .role-shell{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 30px;}
  @media(max-width:760px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat-card{padding:18px;}
  .stat-card .sv{font-family:'Space Grotesk';font-size:26px;font-weight:700;}
  .stat-card .sl{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .demo-note{display:inline-flex;align-items:center;gap:7px;background:#FFF4DB;color:#8a5a00;padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:18px;}
  table.simple{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.simple th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;}
  table.simple td{padding:11px 10px;border-bottom:1px solid var(--border);}
  .scanbtn{padding:30px;text-align:center;font-weight:700;font-size:16px;border-radius:16px;}
  .scanbtn .ic{font-size:30px;margin-bottom:10px;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  footer{background:var(--navy);color:#9aa4c4;padding:40px 0 30px;margin-top:20px;font-size:13.5px;}
  footer .cols{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(8,14,32,.68);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.28);}
  .modal-card h2{margin:0 0 6px}.modal-card p{margin:0 0 18px}.modal-card .field{margin-bottom:12px}
  .modal-actions{display:flex;gap:10px;margin-top:14px}.modal-actions .btn{flex:1}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand" onclick="go('home')" style="cursor:pointer">
        <div class="mark">🅿️</div> Insta-Park
      </div>
      <nav class="navlinks">
        <a onclick="go('search')">Find Parking</a>
        <a onclick="go('home',true)">How it works</a>
        <a onclick="go('partner')">List your Parking</a>

function drawQR(bookingId){
  const c = document.getElementById('qrcanvas'); if(!c) return;
  const ctx = c.getContext('2d');
  const n=18, cell=180/n;
  // deterministic pseudo-random from bookingId
  let seed=0; for(const ch of bookingId) seed = (seed*31+ch.charCodeAt(0))>>>0;
  function rnd(){ seed=(seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; }
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,180,180);
  ctx.fillStyle='#101B3D';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if(rnd()>0.56) ctx.fillRect(x*cell,y*cell,cell-1,cell-1); }
  // finder squares
  function finder(px,py){ ctx.fillStyle='#101B3D'; ctx.fillRect(px,py,cell*4,cell*4); ctx.fillStyle='#fff'; ctx.fillRect(px+cell,py+cell,cell*2,cell*2); ctx.fillStyle='#101B3D'; ctx.fillRect(px+cell*1.6,py+cell*1.6,cell*0.8,cell*0.8);}
  finder(2,2); finder(180-cell*4-2,2); finder(2,180-cell*4-2);
}

function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openAuth(){
  if(document.getElementById('authModal')) return;
  const m=document.createElement('div'); m.id='authModal'; m.className='modal-backdrop';

  <div class="modal-actions"><button class="btn btn-blue" onclick="loginEmail()">Log in</button><button class="btn btn-amber" onclick="signupEmail()">Sign up</button></div>
  <button class="btn btn-ghost btn-block" onclick="closeAuth()">Close</button></div>`; document.body.appendChild(m);
}
function closeAuth(){document.getElementById('authModal')?.remove();}
async function loginEmail(){
  const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPass').value;
  const {error}=await db.auth.signInWithPassword({email,password}); if(error){toast(error.message);return;} closeAuth(); toast('Logged in');
}
async function signupEmail(){
  const full_name=document.getElementById('authName').value.trim(), email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPass').value;
  if(!full_name){toast('Please enter your name');return;} if(password.length<6){toast('Password must be at least 6 characters');return;}
  const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name}}}); if(error){toast(error.message);return;} closeAuth();
  toast(data.session?'Account created':'Account created — check your email to confirm');
}

async function refreshAccount(){
  const {data:{user}}=await db.auth.getUser(); CURRENT_USER=user||null; CURRENT_PROFILE=null;
  if(CURRENT_USER){ const {data}=await db.from('profiles').select('id,full_name,phone,role').eq('id',CURRENT_USER.id).maybeSingle(); CURRENT_PROFILE=data||null; await loadVehicles(); }
  const b=document.getElementById('authBtn'); if(b) b.textContent=CURRENT_USER?'Log out':'Log in';

async function loadVehicles(){
  if(!CURRENT_USER){VEHICLES=[];return;} const {data,error}=await db.from('vehicles').select('*').order('created_at'); if(error)return;
  VEHICLES=(data||[]).map(v=>({id:v.id,label:v.nickname||'My Vehicle',reg:v.vehicle_number,type:(v.vehicle_type||'car').toLowerCase()==='bike'?'Bike':'Car'}));
  if(VEHICLES.length&&!VEHICLES.some(v=>v.id===S.draft.vehicleId)) S.draft.vehicleId=VEHICLES[0].id;
}
async function loadParkingLocations(){
  const {data,error}=await db.from('parking_locations').select('*').eq('is_active',true); if(error||!data)return;
  data.forEach(row=>{const p=PARKINGS.find(x=>x.name===row.name); if(p){p.dbId=row.id;p.price=Math.max(MIN_PRICE,Number(row.hourly_rate));p.total=row.total_slots; const a=row.amenities||[]; FILTER_KEYS.forEach(k=>p[k]=a.includes(k));}});
}
